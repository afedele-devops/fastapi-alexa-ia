version: "3.9"

services:
  fastapi:
    build: .
    container_name: fastapi_server
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_engine
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
